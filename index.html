<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <title>muduo C++ 个人训练系统 V5</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome 图标 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- Google Fonts: 衬线与等宽字体 (Noto Serif SC + Courier Prime) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Courier+Prime:ital,wght@0,400;0,700;1,400&family=Noto+Serif+SC:wght@400;600;700;900&display=swap" rel="stylesheet">
    <!-- Highlight.js 语法高亮 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/cpp.min.js"></script>

    <script>
        if (typeof tailwind !== 'undefined') {
            tailwind.config = {
                theme: {
                    extend: {
                        fontFamily: {
                            serifMono: ['"Courier Prime"', '"Noto Serif SC"', '"Songti SC"', '"STSong"', 'SimSun', 'serif', 'monospace'],
                            serifHeading: ['"Noto Serif SC"', '"Songti SC"', 'STSong', 'Georgia', 'serif']
                        },
                        colors: {
                            parchment: {
                                50: '#faf9f6',
                                100: '#f4efe6',
                                200: '#e8ded0',
                                800: '#3d342a',
                                900: '#231d16'
                            },
                            oxford: {
                                50: '#f0f4f8',
                                100: '#d9e2ec',
                                500: '#1e40af',
                                600: '#0369a1',
                                700: '#075985',
                                800: '#0c4a6e',
                                900: '#082f49'
                            }
                        }
                    }
                }
            };
        }
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <link rel="stylesheet" href="css/style.css?v=5.4.1">
</head>
<body class="min-h-screen antialiased selection:bg-amber-100 selection:text-amber-900 pb-16 flex flex-col justify-between">

<!-- 顶部全局通知 Toast -->
<div id="toast" class="fixed top-5 right-5 z-50 transform -translate-y-24 opacity-0 transition-all duration-300 pointer-events-none flex items-center gap-3 bg-stone-900/95 text-stone-100 px-5 py-3 rounded-xl shadow-2xl border border-stone-700 text-xs sm:text-sm font-serifMono backdrop-blur-md" role="status" aria-live="polite">
    <span id="toast-icon" class="text-emerald-400 font-bold text-base"><i class="fa-solid fa-check"></i></span>
    <span id="toast-msg">记录已保存</span>
</div>

<div class="max-w-7xl mx-auto px-3 sm:px-6 lg:px-8 pt-4 sm:pt-7 w-full">
    
    <!-- 头部学术看板与统计总览 (优化布局：顶栏标题与操作指引，下栏 7 维全宽指标卡片) -->
    <header class="bg-white rounded-2xl p-5 sm:p-7 border border-stone-200 academic-card mb-6 sm:mb-8 relative overflow-hidden">
        <div class="absolute top-0 right-0 w-48 h-48 bg-gradient-to-bl from-amber-50 to-transparent pointer-events-none rounded-tr-2xl"></div>
        
        <!-- 第一行：系统标题与右侧环境指引 -->
        <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-4 relative z-10">
            <div>
                <div class="inline-flex flex-wrap items-center gap-2 px-3 py-1 rounded-full bg-amber-50 border border-amber-200 text-amber-900 text-xs font-serifMono mb-2.5">
                    <span class="w-2 h-2 rounded-full bg-amber-600 animate-pulse"></span>
                    <span>INDUSTRIAL REACTOR ENGINE</span>
                    <span class="text-amber-400">•</span>
                    <span class="font-bold">面向 muduo 源码攻坚 • V5.0 个人训练系统</span>
                </div>
                <h1 class="text-2xl sm:text-3xl font-black text-stone-900 tracking-tight font-serif-heading">
                    muduo C++ 个人训练系统 V5
                </h1>
                <p class="text-stone-600 text-xs sm:text-sm mt-1.5 max-w-3xl leading-relaxed">
                    以《C++ Primer Plus 第6版（中文版）》实体排版为精准基准，构建从<strong>学习 ➔ 实验 ➔ 自测 ➔ 掌握 ➔ 复习 ➔ 源码 ➔ 实战</strong>的完整工业级闭环。直击生命周期、RAII、智能指针、STL 容器、Lambda 闭包与 bind 回调，穿透 Reactor 架构！
                </p>
            </div>

            <!-- 右侧快捷指引按钮 -->
            <div class="flex items-center gap-2.5 shrink-0 self-start md:self-auto font-serifMono">
                <button onclick="openEnvGuideModal()" class="px-4 py-2 rounded-xl bg-sky-50 hover:bg-sky-100 text-sky-900 border border-sky-200 text-xs font-bold transition flex items-center gap-2 shadow-xs group cursor-pointer" aria-label="开发环境与企业实战工作流指引">
                    <i class="fa-solid fa-server text-sky-700 group-hover:scale-110 transition"></i>
                    <span>企业级开发环境指引</span>
                </button>
            </div>
        </div>

        <!-- 第二行：统计指标卡片 (全宽独立行，7 项维度舒展对齐，永不挤压折行) -->
        <div class="grid grid-cols-2 sm:grid-cols-4 lg:grid-cols-7 gap-2.5 sm:gap-3 mt-6 pt-5 border-t border-stone-100 font-serifMono">
            <div class="bg-stone-50/90 p-3 rounded-xl border border-stone-200/90 text-center flex flex-col justify-between hover:border-sky-300 transition">
                <div class="text-xs text-stone-500 font-bold flex items-center justify-center gap-1.5 whitespace-nowrap">
                    <i class="fa-solid fa-compass text-sky-700 text-xs"></i> 学习进度
                </div>
                <div class="text-xl sm:text-2xl font-bold text-sky-800 my-1" id="stat-progress-val">0%</div>
                <div class="text-[11px] text-stone-400 font-semibold truncate" id="stat-progress-count">0 / 28 天</div>
            </div>

            <div class="bg-stone-50/90 p-3 rounded-xl border border-stone-200/90 text-center flex flex-col justify-between hover:border-emerald-300 transition">
                <div class="text-xs text-stone-500 font-bold flex items-center justify-center gap-1.5 whitespace-nowrap">
                    <i class="fa-solid fa-award text-emerald-600 text-xs"></i> 知识掌握
                </div>
                <div class="text-xl sm:text-2xl font-bold text-emerald-700 my-1" id="stat-mastery-val">0%</div>
                <div class="text-[11px] text-stone-400 font-semibold truncate" id="stat-mastery-sub">L0 ~ L5 评级</div>
            </div>

            <div class="bg-stone-50/90 p-3 rounded-xl border border-stone-200/90 text-center flex flex-col justify-between hover:border-indigo-300 transition">
                <div class="text-xs text-stone-500 font-bold flex items-center justify-center gap-1.5 whitespace-nowrap">
                    <i class="fa-solid fa-flask text-indigo-600 text-xs"></i> Demo 跑通
                </div>
                <div class="text-xl sm:text-2xl font-bold text-indigo-700 my-1" id="stat-demo-val">0 / 28</div>
                <div class="text-[11px] text-stone-400 font-semibold truncate">实验工作台</div>
            </div>

            <div class="bg-stone-50/90 p-3 rounded-xl border border-stone-200/90 text-center flex flex-col justify-between hover:border-teal-300 transition">
                <div class="text-xs text-stone-500 font-bold flex items-center justify-center gap-1.5 whitespace-nowrap">
                    <i class="fa-solid fa-code-branch text-teal-700 text-xs"></i> 源码研读
                </div>
                <div class="text-xl sm:text-2xl font-bold text-teal-800 my-1" id="stat-source-val">0 / 8</div>
                <div class="text-[11px] text-stone-400 font-semibold truncate">核心流水线</div>
            </div>

            <div class="bg-stone-50/90 p-3 rounded-xl border border-stone-200/90 text-center flex flex-col justify-between hover:border-amber-300 transition">
                <div class="text-xs text-stone-500 font-bold flex items-center justify-center gap-1.5 whitespace-nowrap">
                    <i class="fa-solid fa-clock text-amber-600 text-xs"></i> 今日学习
                </div>
                <div class="text-xl sm:text-2xl font-bold text-amber-700 my-1" id="stat-today-time">0 min</div>
                <div class="text-[11px] text-stone-400 font-semibold truncate">专注会话</div>
            </div>

            <div class="bg-stone-50/90 p-3 rounded-xl border border-stone-200/90 text-center flex flex-col justify-between hover:border-rose-300 transition">
                <div class="text-xs text-stone-500 font-bold flex items-center justify-center gap-1.5 whitespace-nowrap">
                    <i class="fa-solid fa-repeat text-rose-600 text-xs"></i> 间隔复习
                </div>
                <div class="text-xl sm:text-2xl font-bold text-rose-600 my-1" id="stat-reviews-val">0 项</div>
                <div class="text-[11px] text-stone-400 font-semibold truncate">到期待巩固</div>
            </div>

            <div class="bg-stone-50/90 p-3 rounded-xl border border-stone-200/90 text-center flex flex-col justify-between hover:border-amber-400 transition col-span-2 sm:col-span-2 lg:col-span-1">
                <div class="text-xs text-stone-500 font-bold flex items-center justify-center gap-1.5 whitespace-nowrap">
                    <i class="fa-solid fa-fire text-amber-700 text-xs"></i> 连续攻坚
                </div>
                <div class="text-xl sm:text-2xl font-bold text-amber-800 my-1" id="stat-streak">0 天</div>
                <div class="text-[11px] text-stone-400 font-semibold truncate">真实日期</div>
            </div>
        </div>

        <!-- 第三行：专注学习计时与快捷记时栏 -->
        <div class="mt-4 pt-4 border-t border-stone-100 flex flex-col md:flex-row items-stretch md:items-center justify-between gap-3 text-xs font-serifMono bg-stone-50/60 p-3 rounded-xl border border-stone-200/80">
            <div class="flex items-center gap-3 flex-wrap">
                <span class="font-bold text-stone-800 flex items-center gap-1.5">
                    <i class="fa-solid fa-stopwatch text-amber-600"></i> 专注会话：
                </span>
                <span id="timer-display" class="font-bold text-sky-900 bg-white px-2.5 py-1 rounded-lg border border-stone-200 text-sm tracking-widest">
                    00:00
                </span>
                <button id="btn-timer-toggle" onclick="toggleStudyTimer()" class="px-3 py-1 rounded-lg bg-emerald-600 hover:bg-emerald-700 text-white font-bold transition shadow-xs cursor-pointer flex items-center gap-1.5">
                    <i id="btn-timer-icon" class="fa-solid fa-play"></i>
                    <span id="btn-timer-text">开始专注</span>
                </button>
                <button onclick="resetStudyTimer()" class="px-2.5 py-1 rounded-lg bg-stone-200 hover:bg-stone-300 text-stone-700 transition cursor-pointer flex items-center gap-1">
                    <i class="fa-solid fa-rotate-left"></i> <span>重置</span>
                </button>
                <button onclick="saveActiveSession()" class="px-2.5 py-1 rounded-lg bg-sky-700 hover:bg-sky-800 text-white font-bold transition cursor-pointer flex items-center gap-1">
                    <i class="fa-solid fa-check"></i> <span>归档会话</span>
                </button>
                <select id="timer-day" class="bg-white border border-stone-200 rounded-lg px-2 py-1 text-xs text-stone-700 font-serifMono" title="关联攻坚Day">
                </select>
                <select id="timer-type" class="bg-white border border-stone-200 rounded-lg px-2 py-1 text-xs text-stone-700 font-serifMono" title="攻坚类型">
                    <option value="coding">代码攻坚</option>
                    <option value="reading">书目研读</option>
                    <option value="debug">排错调试</option>
                </select>
            </div>
            <div class="flex items-center gap-2 text-stone-500 text-[11px]">
                <i class="fa-solid fa-shield text-amber-600"></i>
                <span>工业沉浸模式 · 支持番茄钟与会话归档</span>
            </div>
        </div>

        <!-- 进度条 -->
        <div class="mt-4 pt-4 border-t border-stone-100">
            <div class="flex items-center justify-between text-xs text-stone-500 font-serifMono mb-1.5">
                <span id="progress-bar-text">准备踏入 muduo 源码大门</span>
                <span class="text-amber-700 font-semibold">28 Days Mastery Pipeline</span>
            </div>
            <div class="w-full h-2.5 bg-stone-100 rounded-full overflow-hidden border border-stone-200/80">
                <div id="progress-fill" class="h-full bg-gradient-to-r from-sky-600 via-indigo-600 to-amber-600 transition-all duration-500 rounded-full" style="width: 0%;"></div>
            </div>
        </div>
    </header>

    <!-- 顶部主视图切换导航 (6大核心模块) -->
    <nav class="flex space-x-2 overflow-x-auto pb-2 sm:pb-3 mb-6 font-serifHeading text-xs sm:text-sm" id="view-tabs" role="tablist" aria-label="主视图导航">
        <button onclick="switchView('dashboard')" id="nav-dashboard" class="px-4 py-2 rounded-xl flex items-center gap-2 font-bold bg-white text-stone-900 border border-stone-300 shadow-sm transition whitespace-nowrap" role="tab" aria-selected="true" aria-label="攻坚大盘与架构拓扑">
            <i class="fa-solid fa-chart-pie text-sky-700"></i> 攻坚大盘与架构拓扑
        </button>
        <button onclick="switchView('daily')" id="nav-daily" class="px-4 py-2 rounded-xl flex items-center gap-2 font-semibold text-stone-600 hover:text-stone-900 hover:bg-stone-100 transition whitespace-nowrap" role="tab" aria-selected="false" aria-label="28天任务与实验">
            <i class="fa-solid fa-calendar-check text-amber-600"></i> 28天任务与实验
        </button>
        <button onclick="switchView('mapping')" id="nav-mapping" class="px-4 py-2 rounded-xl flex items-center gap-2 font-semibold text-stone-600 hover:text-stone-900 hover:bg-stone-100 transition whitespace-nowrap" role="tab" aria-selected="false" aria-label="语法 ➔ muduo 映射矩阵">
            <i class="fa-solid fa-sitemap text-emerald-600"></i> 语法 ➔ muduo 映射矩阵
        </button>
        <button onclick="switchView('quiz')" id="nav-quiz" class="px-4 py-2 rounded-xl flex items-center gap-2 font-semibold text-stone-600 hover:text-stone-900 hover:bg-stone-100 transition whitespace-nowrap" role="tab" aria-selected="false" aria-label="每日自测中心">
            <i class="fa-solid fa-clipboard-question text-purple-600"></i> 每日自测中心
        </button>
        <button onclick="switchView('source')" id="nav-source" class="px-4 py-2 rounded-xl flex items-center gap-2 font-semibold text-stone-600 hover:text-stone-900 hover:bg-stone-100 transition whitespace-nowrap" role="tab" aria-selected="false" aria-label="muduo 源码路线">
            <i class="fa-solid fa-code-branch text-teal-600"></i> muduo 源码路线
        </button>
        <button onclick="switchView('pitfalls')" id="nav-pitfalls" class="px-4 py-2 rounded-xl flex items-center gap-2 font-semibold text-stone-600 hover:text-stone-900 hover:bg-stone-100 transition whitespace-nowrap" role="tab" aria-selected="false" aria-label="C++ 踩坑档案">
            <i class="fa-solid fa-bug text-rose-600"></i> C++ 踩坑档案
        </button>
    </nav>

    <!-- ==================== VIEW 1: 仪表盘与架构拓扑 ==================== -->
    <section id="view-dashboard" class="space-y-6">
        
        <!-- 今日最高优先级任务卡 (Today's Mission) -->
        <div id="today-mission-card" class="bg-gradient-to-r from-amber-50 via-white to-sky-50 rounded-2xl p-5 sm:p-6 border border-amber-200/80 academic-card">
            <!-- 由 JS 动态计算填充 -->
        </div>

        <!-- 28 天日历热力打卡矩阵 -->
        <div class="bg-white rounded-2xl p-5 sm:p-7 border border-stone-200 academic-card">
            <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3 mb-5">
                <div>
                    <h2 class="text-base sm:text-lg font-bold text-stone-900 flex items-center gap-2 font-serif-heading">
                        <i class="fa-solid fa-calendar-days text-amber-700"></i> 28 天定向攻坚打卡索引网格
                    </h2>
                    <p class="text-xs text-stone-500 mt-0.5">单元格颜色映射 0~5 阶掌握度等级，点击直接跳转定位任务卡片。</p>
                </div>
                <!-- 图例说明 -->
                <div class="flex flex-wrap items-center gap-2 sm:gap-3 text-xs font-serifMono text-stone-600">
                    <span class="flex items-center gap-1"><span class="w-2.5 h-2.5 rounded-full bg-stone-200 inline-block"></span> 未开始 (0)</span>
                    <span class="flex items-center gap-1"><span class="w-2.5 h-2.5 rounded-full bg-amber-400 inline-block"></span> 已阅读 (1)</span>
                    <span class="flex items-center gap-1"><span class="w-2.5 h-2.5 rounded-full bg-sky-500 inline-block"></span> 已理解 (2)</span>
                    <span class="flex items-center gap-1"><span class="w-2.5 h-2.5 rounded-full bg-indigo-500 inline-block"></span> Demo跑通 (3)</span>
                    <span class="flex items-center gap-1"><span class="w-2.5 h-2.5 rounded-full bg-emerald-600 inline-block"></span> 独立实现 (4)</span>
                    <span class="flex items-center gap-1"><span class="w-2.5 h-2.5 rounded-full bg-emerald-800 inline-block"></span> 源码贯通 (5)</span>
                </div>
            </div>

            <!-- 28 天自适应网格 -->
            <div class="grid grid-cols-4 sm:grid-cols-7 gap-2 sm:gap-2.5" id="calendar-grid">
                <!-- 由 JavaScript 动态生成 -->
            </div>
        </div>

        <!-- 学习时间统计与间隔复习待办双栏 -->
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
            <!-- 左栏：学习时间统计卡片与纯轻量 SVG 柱状图 -->
            <div class="lg:col-span-7 bg-white rounded-2xl p-5 sm:p-6 border border-stone-200 academic-card">
                <div class="flex items-center justify-between mb-4">
                    <div>
                        <h3 class="text-sm sm:text-base font-bold text-stone-900 flex items-center gap-2 font-serif-heading">
                            <i class="fa-solid fa-chart-simple text-sky-800"></i> 近 7 天专注投入分布
                        </h3>
                        <p class="text-[11px] text-stone-500 mt-0.5">轻量原生矢量可视化，记录真实专注学习曲线。</p>
                    </div>
                    <span class="text-xs font-serifMono text-stone-500 bg-stone-100 px-2.5 py-1 rounded-lg">
                        累计 <span id="stat-total-hours" class="font-bold text-stone-900">0.0</span> 小时
                    </span>
                </div>

                <div class="grid grid-cols-4 gap-2 mb-4 text-center font-serifMono">
                    <div class="bg-stone-50 p-2 rounded-lg border border-stone-200/60">
                        <div class="text-[10px] text-stone-400">今日时间</div>
                        <div class="text-xs sm:text-sm font-bold text-amber-800" id="stat-card-today">0m</div>
                    </div>
                    <div class="bg-stone-50 p-2 rounded-lg border border-stone-200/60">
                        <div class="text-[10px] text-stone-400">本周时间</div>
                        <div class="text-xs sm:text-sm font-bold text-sky-800" id="stat-card-week">0m</div>
                    </div>
                    <div class="bg-stone-50 p-2 rounded-lg border border-stone-200/60">
                        <div class="text-[10px] text-stone-400">日均时间</div>
                        <div class="text-xs sm:text-sm font-bold text-emerald-800" id="stat-card-avg">0m</div>
                    </div>
                    <div class="bg-stone-50 p-2 rounded-lg border border-stone-200/60">
                        <div class="text-[10px] text-stone-400">记录会话</div>
                        <div class="text-xs sm:text-sm font-bold text-stone-800" id="stat-card-sessions">0次</div>
                    </div>
                </div>

                <!-- 纯 SVG 7天柱状图 -->
                <div class="w-full h-36 bg-stone-50/50 rounded-xl border border-stone-200 p-2" id="study-chart-container">
                    <!-- 由 JS 动态绘制 -->
                </div>
            </div>

            <!-- 右栏：艾宾浩斯间隔复习今日清单 -->
            <div class="lg:col-span-5 bg-white rounded-2xl p-5 sm:p-6 border border-stone-200 academic-card flex flex-col justify-between">
                <div>
                    <div class="flex items-center justify-between mb-3">
                        <h3 class="text-sm sm:text-base font-bold text-stone-900 flex items-center gap-2 font-serif-heading">
                            <i class="fa-solid fa-repeat text-rose-600"></i> 今日待复习清单
                        </h3>
                        <span id="badge-due-count" class="text-xs font-serifMono font-bold px-2 py-0.5 rounded-full bg-rose-100 text-rose-800">
                            0 项到期
                        </span>
                    </div>
                    <p class="text-[11px] text-stone-500 mb-3 leading-relaxed">
                        基于 [1d ➔ 3d ➔ 7d ➔ 14d ➔ 30d] 记忆衰减阶梯，对已完成自测的内容定期巩固。
                    </p>

                    <div id="review-due-list" class="space-y-2 max-h-48 overflow-y-auto pr-1">
                        <!-- JS 填充到期复习项 -->
                    </div>
                </div>

                <div class="mt-4 pt-3 border-t border-stone-100 flex items-center justify-between">
                    <span class="text-[11px] text-stone-400 font-serifMono">按 R 键随时打开复习闪卡</span>
                    <button onclick="openReviewModal()" class="px-3.5 py-1.5 rounded-xl bg-stone-900 text-stone-100 hover:bg-stone-800 text-xs font-serifMono font-bold transition flex items-center gap-1.5">
                        <i class="fa-solid fa-play"></i> 开启今日复习
                    </button>
                </div>
            </div>
        </div>

        <!-- 知识推导路线与 muduo 架构拓扑 (可点击交互式工程蓝图) -->
        <div class="bg-white rounded-2xl p-5 sm:p-7 border border-stone-200 academic-card overflow-hidden">
            <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-3 mb-5">
                <div>
                    <div class="inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded bg-sky-50 border border-sky-200 text-sky-800 text-[11px] font-serifMono uppercase tracking-wider mb-1">

        <div id="env-pane-debug" class="space-y-3 text-stone-700 text-xs leading-relaxed hidden">

                <div class="font-bold text-indigo-950 font-serifHeading text-xs flex items-center gap-1.5">
                    <i class="fa-solid fa-crosshairs text-indigo-700"></i> 一、图形化断点调试（GDB 联动）
                </div>
                <p class="text-[11.5px] text-stone-700 font-serifHeading">
                    编译时加上 <code>-g</code> 调试符号。直接在代码行号左侧单击鼠标打上红点。
                    在 <code>.vscode/launch.json</code> 中配置：
                </p>
                <pre class="bg-stone-900 text-emerald-400 p-2.5 rounded-lg text-[11px]">{
    "version": "0.2.0",
    "configurations": [
        {
            "name": "Debug muduo demo",
            "type": "cppdbg",
            "request": "launch",
            "program": "${workspaceFolder}/test_epoll",
            "cwd": "${workspaceFolder}",
            "MIMode": "gdb",
            "setupCommands": [{ "text": "-enable-pretty-printing" }]
        }
    ]
}</pre>
                <p class="text-[11px] text-stone-600 font-serifHeading">
                    按 <code>F5</code> 启动调试！代码将自动停在断点处，左侧可直观查看变量、智能指针指向、调用栈，按 <code>F10</code> 单步跳过。
                </p>
            </div>

            <div class="bg-rose-50/70 border border-rose-200 rounded-xl p-3.5 space-y-2 font-serifMono">
                <div class="font-bold text-rose-950 font-serifHeading text-xs flex items-center gap-1.5">
                    <i class="fa-solid fa-shield-halved text-rose-700"></i> 二、工业级内存泄漏与越界检测（AddressSanitizer）
                </div>
                <p class="text-[11.5px] text-stone-700 font-serifHeading">
                    C++ 最怕悬空指针和野指针。在编译时加上 <code>-fsanitize=address -g</code> 即可激活 GCC 内置的 ASan 内存检测神探：
                </p>
                <pre class="bg-stone-900 text-rose-300 p-2 rounded-lg text-[11px]">g++ -std=c++17 -fsanitize=address -g main.cpp -o main_asan && ./main_asan</pre>
                <p class="text-[11px] text-stone-600 font-serifHeading">
                    一旦有内存泄漏、堆越界（heap-buffer-overflow）或 use-after-free，程序退出时 Linux 会在屏幕打印精确到具体代码行数的排查报告！
                </p>
            </div>
        </div>

                    <i class="fa-solid fa-folder-tree text-teal-700"></i> 一、多文件项目的标准 CMake 工程结构
                </div>
                <p class="text-[11.5px] text-stone-600 font-serifHeading">
                    在学习 muduo 时，往往会有 Channel.cpp、Poller.cpp、EventLoop.cpp 多个源文件，推荐在阿里云上这样组织：
                </p>
                <pre class="bg-stone-900 text-teal-300 p-2.5 rounded-lg text-[11px]">my_muduo/
├── CMakeLists.txt
├── include/
│   └── Channel.h
├── src/
│   ├── Channel.cpp
│   └── main.cpp
└── build/              # 编译中间文件目录</pre>
                <p class="text-[11px] text-stone-600 font-serifHeading mt-1">在 <code>CMakeLists.txt</code> 中写入标准构建脚本：</p>
                <pre class="bg-stone-900 text-emerald-400 p-2.5 rounded-lg text-[11px]">cmake_minimum_required(VERSION 3.10)
project(TinyMuduo CXX)
set(CMAKE_CXX_STANDARD 17)
set(CMAKE_CXX_FLAGS "-Wall -Wextra -pthread -g")

include_directories(include)
file(GLOB SOURCES "src/*.cpp")
add_executable(my_server ${SOURCES})</pre>
                <p class="text-[11px] text-stone-600 font-serifHeading mt-1">在终端执行两行命令即可极速完成编译：</p>
                <pre class="bg-stone-900 text-amber-300 p-2 rounded-lg text-[11px]">mkdir -p build && cd build && cmake .. && make -j4</pre>

        <div class="space-y-3 font-serifMono text-xs">
            <div>
                <label class="block text-stone-600 font-bold mb-1">事故标题</label>
                <input type="text" id="np-title" placeholder="如: vector 遍历中调用 push_back 导致迭代器失效" class="w-full bg-stone-50 border border-stone-200 rounded-lg p-2 focus:outline-none focus:border-rose-500">
            </div>
            <div class="grid grid-cols-2 gap-3">
                <div>
                    <label class="block text-stone-600 font-bold mb-1">对应 Day (1~28)</label>
                    <input type="number" id="np-day" min="1" max="28" value="1" class="w-full bg-stone-50 border border-stone-200 rounded-lg p-2 focus:outline-none focus:border-rose-500">
                </div>
                <div>
                    <label class="block text-stone-600 font-bold mb-1">关键词标签 (英文逗号隔开)</label>
                    <input type="text" id="np-keywords" placeholder="iterator, vector, 扩容" class="w-full bg-stone-50 border border-stone-200 rounded-lg p-2 focus:outline-none focus:border-rose-500">
                </div>
            </div>
            <div>
                <label class="block text-stone-600 font-bold mb-1">错误代码片段</label>
                <textarea id="np-error-code" rows="3" placeholder="// 导致崩溃或异常的错误代码" class="w-full bg-stone-50 border border-stone-200 rounded-lg p-2 font-mono-code"></textarea>
            </div>
            <div>
                <label class="block text-stone-600 font-bold mb-1">错误现象与报错信息</label>
                <input type="text" id="np-symptom" placeholder="如: 段错误崩溃 (SIGSEGV) 或数据混乱" class="w-full bg-stone-50 border border-stone-200 rounded-lg p-2">
            </div>
            <div>
                <label class="block text-stone-600 font-bold mb-1">根因剖析</label>
                <textarea id="np-cause" rows="2" placeholder="分析为何发生此错误，底层机制原因..." class="w-full bg-stone-50 border border-stone-200 rounded-lg p-2"></textarea>
            </div>
            <div>
                <label class="block text-stone-600 font-bold mb-1">正确修复代码</label>
                <textarea id="np-correct-code" rows="3" placeholder="// 规范工业级写法" class="w-full bg-stone-50 border border-stone-200 rounded-lg p-2 font-mono-code"></textarea>
            </div>
            <div>
                <label class="block text-stone-600 font-bold mb-1">工程结论与铁律</label>
                <input type="text" id="np-conclusion" placeholder="如: 【工程铁律】遍历连续容器时严禁直接修改容量" class="w-full bg-stone-50 border border-stone-200 rounded-lg p-2">
            </div>
        </div>

        <div class="mt-5 pt-3 border-t border-stone-100 flex justify-end gap-2 font-serifMono">
            <button onclick="closeNewPitfallModal()" class="px-4 py-1.5 bg-stone-100 text-stone-700 text-xs font-semibold rounded-xl hover:bg-stone-200 transition">取消</button>
            <button onclick="submitNewPitfall()" class="px-4 py-1.5 bg-rose-600 text-white text-xs font-semibold rounded-xl hover:bg-rose-700 transition shadow-xs">保存入库</button>
        </div>
    </div>
</div>
